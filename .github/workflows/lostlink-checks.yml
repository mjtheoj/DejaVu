name: LostLink checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-not-for-deployment-8f36b2f7e0bc4a4fa5a7a6cfb121ab17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Check JavaScript syntax
        run: node --check app/static/app.js
      - name: Run unit, workflow and frontend contract tests
        run: python -m unittest discover -s tests -v
      - name: Import application
        run: python -c "import app.main; print('LostLink application import OK')"

  matching-evaluation:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - name: Install optional semantic model dependencies
        run: python -m pip install -r requirements-ml.txt
      - name: Measure labelled retrieval top-3
        env:
          USE_SEMANTIC_MODEL: "true"
          SEMANTIC_MODEL: sentence-transformers/all-MiniLM-L6-v2
        run: python scripts/evaluate_matching.py --require-semantic-model

name: LostLink checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-not-for-deployment-8f36b2f7e0bc4a4fa5a7a6cfb121ab17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Check JavaScript syntax
        run: node --check app/static/app.js
      - name: Run unit, workflow and frontend contract tests
        run: python -m unittest discover -s tests -v
      - name: Import application
        run: python -c "import app.main; print('LostLink application import OK')"
